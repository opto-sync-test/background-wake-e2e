name: DEN-2132 Dart format probe

on:
  pull_request:
    paths:
      - 'tests/dart/test/connectivity_proof_test.dart'
      - '.github/workflows/den-2132-dart-format-probe.yml'

permissions:
  contents: read

jobs:
  print-canonical-format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out proof branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          show-progress: false

      - name: Install stable Dart
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: stable

      - name: Print canonical formatter output
        run: |
          set -euo pipefail
          dart format tests/dart/test/connectivity_proof_test.dart
          echo '----- BEGIN CANONICAL DART TEST -----'
          cat tests/dart/test/connectivity_proof_test.dart
          echo '----- END CANONICAL DART TEST -----'
          exit 1
